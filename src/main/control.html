<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Stash</title>
<style>
  :root { --cream: #fbf4e8; --espresso: #3b2a20; --accent: #b8622e; --border: #e6d8c3; --soft: #f3e6d0; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 22px; background: var(--cream); color: var(--espresso); font: 14px/20px 'Segoe UI', system-ui, sans-serif; user-select: none; }
  h1 { margin: 0 0 2px; font-size: 20px; line-height: 26px; }
  .sub { margin: 0 0 16px; color: #7a6657; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #4aa564; margin-right: 6px; }
  .dot.hid { background: #c7b59e; }
  button { display: block; width: 100%; margin: 0 0 8px; padding: 10px 14px; text-align: left; font: 600 14px/20px 'Segoe UI', system-ui, sans-serif; color: var(--espresso); background: #fff; border: 1px solid var(--border); border-radius: 12px; cursor: pointer; }
  button:hover { background: var(--soft); }
  button small { display: block; font-weight: 400; color: #7a6657; }
  button.danger { color: #fff; background: var(--accent); border-color: var(--accent); }
  button.danger small { color: #ffe9d9; }
  button.danger:hover { background: #a2541f; }
  .foot { margin-top: 10px; color: #a08f7e; font-size: 12px; }
</style>
</head>
<body>
  <h1>Stash</h1>
  <p class="sub"><span id="dot" class="dot"></span><span id="status">Stash is running</span></p>
  <button id="toggle"><span id="toggleLabel">Hide Stash</span><small>Show or hide the squirrel</small></button>
  <button id="reset">Wake Stash up<small>Use this if Stash stops moving or can't be clicked</small></button>
  <button id="restart">Restart Stash<small>Closes and opens Stash again</small></button>
  <button id="quit" class="danger">Quit Stash<small>Closes Stash completely</small></button>
  <div class="foot" id="foot"></div>
<script>
  const $ = (id) => document.getElementById(id);
  const render = (s) => {
    $('status').textContent = s.hidden ? 'Stash is hidden' : 'Stash is running';
    $('dot').className = 'dot' + (s.hidden ? ' hid' : '');
    $('toggleLabel').textContent = s.hidden ? 'Show Stash' : 'Hide Stash';
    $('foot').textContent = 'Version ' + s.version + (s.wakeups ? ' - woken up ' + s.wakeups + 'x this session' : '');
  };
  for (const id of ['toggle', 'reset', 'restart', 'quit']) $(id).onclick = () => window.ctl.act(id);
  window.ctl.onState(render);
  window.ctl.state().then(render);
</script>
</body>
</html>
